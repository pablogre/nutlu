<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUTLU · Hacé tu pedido</title>
<meta name="description" content="Pedí online los chipás y dátiles bombón de NUTLU. Ricos posta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     NUTLU — Formulario de pedido
     Marca: naranja #E85A2A · violeta #B07FD4 · crema #FAF0EC
     ============================================================ */

  :root{
    --naranja:#E85A2A;
    --naranja-fuerte:#F04E23;
    --violeta:#B07FD4;
    --violeta-oscuro:#9B63C4;
    --crema:#FAF0EC;
    --blanco:#FFFFFF;
    --texto:#4A3F3A;
    --borde-suave:rgba(232,90,42,.28);
    --sombra:0 18px 50px rgba(155,99,196,.16);
    --radio:22px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:smooth}

  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--crema);
    color:var(--texto);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* Rayas decorativas laterales (como el registro impreso) */
  .rayas{
    position:fixed;
    top:0;left:0;bottom:0;
    width:70px;
    display:flex;
    z-index:0;
    pointer-events:none;
  }
  .rayas span{height:100%}
  .rayas span:nth-child(1){width:26px;background:var(--naranja-fuerte)}
  .rayas span:nth-child(2){width:10px;background:var(--crema)}
  .rayas span:nth-child(3){width:16px;background:var(--naranja)}
  .rayas span:nth-child(4){width:8px;background:var(--crema)}
  .rayas span:nth-child(5){width:10px;background:var(--naranja-fuerte)}

  .contenedor{
    position:relative;
    z-index:1;
    max-width:720px;
    margin:0 auto;
    padding:38px 20px 60px;
  }

  /* Marca */
  .marca{text-align:center;margin-bottom:26px}
  .marca .logo{
    font-weight:800;
    font-size:clamp(46px,11vw,74px);
    letter-spacing:6px;
    color:var(--naranja);
    line-height:.9;
  }
  .marca .tagline{
    font-weight:500;
    letter-spacing:8px;
    font-size:clamp(12px,3.4vw,17px);
    color:var(--naranja);
    margin-top:6px;
    text-transform:uppercase;
  }

  /* Tarjeta */
  .tarjeta{
    background:var(--crema);
    border:2px solid var(--borde-suave);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:clamp(22px,5vw,40px);
  }
  .titulo{
    text-align:center;
    color:var(--violeta-oscuro);
    font-weight:800;
    font-size:clamp(22px,5.5vw,32px);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .subtitulo{
    text-align:center;
    color:var(--texto);
    opacity:.75;
    font-size:14px;
    margin-bottom:26px;
  }

  /* Campos */
  .campo{margin-bottom:16px}
  .campo label{
    display:block;
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--naranja);
    margin-bottom:6px;
  }
  .campo input,.campo textarea{
    width:100%;
    font-family:inherit;
    font-size:16px;
    color:var(--texto);
    background:var(--blanco);
    border:2px solid transparent;
    border-radius:12px;
    padding:12px 14px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .campo input::placeholder,.campo textarea::placeholder{color:#b9aca4}
  .campo input:focus,.campo textarea:focus{
    border-color:var(--violeta);
    box-shadow:0 0 0 3px rgba(176,127,212,.22);
  }
  .fila{display:flex;gap:14px;flex-wrap:wrap}
  .fila .campo{flex:1;min-width:180px}

  /* Productos */
  .seccion-titulo{
    font-weight:700;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--violeta-oscuro);
    margin:24px 0 12px;
  }
  .producto{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--blanco);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
    border:2px solid transparent;
    transition:border-color .15s ease;
  }
  .producto.activo{border-color:var(--violeta)}
  .producto .info{flex:1;min-width:0}
  .producto .nombre{
    font-weight:600;
    font-size:15px;
    color:var(--violeta-oscuro);
    line-height:1.2;
  }
  .producto .precio{font-size:13px;color:var(--naranja);font-weight:600}

  .stepper{display:flex;align-items:center;gap:0;flex-shrink:0}
  .stepper button{
    width:34px;height:34px;
    border:none;
    background:var(--crema);
    color:var(--naranja);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    display:grid;place-items:center;
    transition:background .15s ease, transform .05s ease;
  }
  .stepper button:hover{background:#f3e2d8}
  .stepper button:active{transform:scale(.9)}
  .stepper button.menos{border-radius:10px 0 0 10px}
  .stepper button.mas{border-radius:0 10px 10px 0}
  .stepper input{
    width:46px;height:34px;
    text-align:center;
    border:none;
    background:var(--crema);
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    color:var(--texto);
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .linea-total{
    width:78px;
    text-align:right;
    font-weight:700;
    font-size:14px;
    color:var(--texto);
    flex-shrink:0;
  }

  /* Total */
  .total-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    margin:26px auto 4px;
    max-width:340px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(232,90,42,.22);
  }
  .total-pill .lbl{
    background:var(--naranja);
    color:var(--blanco);
    font-weight:700;
    letter-spacing:2px;
    padding:16px 26px;
    font-size:15px;
  }
  .total-pill .val{
    background:var(--blanco);
    color:var(--naranja);
    font-weight:800;
    font-size:24px;
    padding:16px 26px;
    flex:1;
    text-align:center;
  }

  /* Botones */
  .acciones{display:flex;flex-direction:column;gap:12px;margin-top:24px}
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    letter-spacing:.3px;
    cursor:pointer;
    transition:transform .06s ease, filter .15s ease, opacity .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-wsp{background:#25D366;color:#fff}
  .btn-wsp:hover{filter:brightness(1.05)}
  .btn-mail{background:var(--violeta);color:#fff}
  .btn-mail:hover{filter:brightness(1.05)}
  .btn svg{width:20px;height:20px}

  /* Mensajes */
  .aviso{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    font-size:14px;
    font-weight:500;
    text-align:center;
    display:none;
  }
  .aviso.ok{background:#e4f7ea;color:#1f8a4c;display:block}
  .aviso.error{background:#fde8e2;color:#c0402a;display:block}

  .pie{
    text-align:center;
    margin-top:28px;
    font-size:13px;
    color:var(--texto);
    opacity:.7;
  }
  .pie a{color:var(--naranja);text-decoration:none;font-weight:600}

  @media (max-width:520px){
    .rayas{width:40px}
    .rayas span:nth-child(1){width:16px}
    .rayas span:nth-child(3){width:10px}
    .contenedor{padding-left:52px}
    .linea-total{width:64px;font-size:13px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="rayas" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="contenedor">

  <header class="marca">
    <div class="logo">NUTLU</div>
    <div class="tagline">Ricos posta</div>
  </header>

  <main class="tarjeta">
    <h1 class="titulo">Hacé tu pedido</h1>
    <p class="subtitulo">Completá tus datos, elegí tus productos y mandanos el pedido 🧡</p>

    <div class="fila">
      <div class="campo">
        <label for="nombre">Nombre y apellido</label>
        <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="tel">WhatsApp</label>
        <input type="tel" id="tel" placeholder="Ej: 3364 123456" autocomplete="tel" required>
      </div>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="localidad">Localidad</label>
        <input type="text" id="localidad" placeholder="Tu ciudad / barrio">
      </div>
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
    </div>

    <h2 class="seccion-titulo">Elegí tus productos</h2>
    <div id="productos"></div>

    <div class="campo" style="margin-top:20px">
      <label for="notas">Aclaraciones (opcional)</label>
      <textarea id="notas" rows="2" placeholder="Horario de entrega, retiro, comentarios..."></textarea>
    </div>

    <div class="total-pill">
      <div class="lbl">TOTAL</div>
      <div class="val" id="totalGeneral">$0</div>
    </div>

    <div class="acciones">
      <button type="button" class="btn btn-wsp" id="btnWsp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 01-1.26-4.34c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 012.41 5.82c0 4.54-3.7 8.23-8.83 8.23z"/></svg>
        Enviar pedido por WhatsApp
      </button>
      <button type="button" class="btn btn-mail" id="btnMail">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Enviar pedido por email
      </button>
    </div>

    <div class="aviso" id="aviso"></div>
  </main>

  <p class="pie">Cualquier duda, escribinos al <a href="https://wa.me/5493364032924" target="_blank" rel="noopener">WhatsApp de NUTLU</a>.</p>

</div>

<script>
/* ============================================================
   CONFIGURACIÓN — editá esto y listo
   ============================================================ */

// Productos y precios (editá acá cuando cambien)
const PRODUCTOS = [
  { id:'chipa',    nombre:'Docena Chipá Blend',      precio:7800 },
  { id:'mani',     nombre:'Dátil Bombón Maní',       precio:8000 },
  { id:'sal',      nombre:'Dátil Bombón Sal Marina', precio:8000 },
];

// WhatsApp del negocio (formato internacional, sin + ni espacios)
const WSP_NEGOCIO = '5493364032924';

// EMAIL: pegá tu Access Key gratis de https://web3forms.com
// (te llega a la casilla que uses al generar la key — la de Luna, la tuya, etc.)
// Mientras esté en 'PEGA-TU-ACCESS-KEY-ACA' el botón de email avisa que falta configurar.
const WEB3FORMS_KEY = 'PEGA-TU-ACCESS-KEY-ACA';

/* ============================================================
   Lógica — no hace falta tocar de acá para abajo
   ============================================================ */

const fmt = new Intl.NumberFormat('es-AR');
const pesos = n => '$' + fmt.format(n);

// Fecha de hoy por defecto
const hoy = new Date();
document.getElementById('fecha').value =
  hoy.getFullYear() + '-' +
  String(hoy.getMonth()+1).padStart(2,'0') + '-' +
  String(hoy.getDate()).padStart(2,'0');

// Render de productos
const contProd = document.getElementById('productos');
PRODUCTOS.forEach(p => {
  const row = document.createElement('div');
  row.className = 'producto';
  row.dataset.id = p.id;
  row.innerHTML = `
    <div class="info">
      <div class="nombre">${p.nombre}</div>
      <div class="precio">${pesos(p.precio)} c/u</div>
    </div>
    <div class="stepper">
      <button type="button" class="menos" aria-label="Restar">−</button>
      <input type="number" min="0" value="0" inputmode="numeric" aria-label="Cantidad de ${p.nombre}">
      <button type="button" class="mas" aria-label="Sumar">+</button>
    </div>
    <div class="linea-total">$0</div>
  `;
  contProd.appendChild(row);

  const input = row.querySelector('input');
  const lineaTotal = row.querySelector('.linea-total');

  const actualizar = () => {
    let q = parseInt(input.value, 10);
    if (isNaN(q) || q < 0) q = 0;
    input.value = q;
    lineaTotal.textContent = pesos(q * p.precio);
    row.classList.toggle('activo', q > 0);
    calcularTotal();
  };

  row.querySelector('.menos').addEventListener('click', () => {
    input.value = Math.max(0, (parseInt(input.value,10)||0) - 1);
    actualizar();
  });
  row.querySelector('.mas').addEventListener('click', () => {
    input.value = (parseInt(input.value,10)||0) + 1;
    actualizar();
  });
  input.addEventListener('input', actualizar);
});

function itemsSeleccionados(){
  const items = [];
  document.querySelectorAll('.producto').forEach(row => {
    const p = PRODUCTOS.find(x => x.id === row.dataset.id);
    const q = parseInt(row.querySelector('input').value, 10) || 0;
    if (q > 0) items.push({ ...p, cantidad:q, subtotal:q*p.precio });
  });
  return items;
}

function calcularTotal(){
  const total = itemsSeleccionados().reduce((s,i) => s + i.subtotal, 0);
  document.getElementById('totalGeneral').textContent = pesos(total);
  return total;
}

function mostrarAviso(texto, tipo){
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.className = 'aviso ' + tipo;
  if (tipo === 'ok') setTimeout(() => { el.className = 'aviso'; }, 6000);
}

function datosValidos(){
  const nombre = document.getElementById('nombre').value.trim();
  const tel = document.getElementById('tel').value.trim();
  const items = itemsSeleccionados();
  if (!nombre){ mostrarAviso('Escribí tu nombre para poder tomar el pedido.', 'error'); return null; }
  if (!tel){ mostrarAviso('Dejanos un WhatsApp para coordinar la entrega.', 'error'); return null; }
  if (items.length === 0){ mostrarAviso('Elegí al menos un producto 🙂', 'error'); return null; }
  return {
    nombre, tel,
    localidad: document.getElementById('localidad').value.trim(),
    fecha: document.getElementById('fecha').value,
    notas: document.getElementById('notas').value.trim(),
    items,
    total: items.reduce((s,i)=>s+i.subtotal,0)
  };
}

function armarResumen(d){
  let txt = '';
  d.items.forEach(i => {
    txt += `• ${i.cantidad}x ${i.nombre} — ${pesos(i.subtotal)}\n`;
  });
  return txt;
}

/* --- Enviar por WhatsApp --- */
document.getElementById('btnWsp').addEventListener('click', () => {
  const d = datosValidos();
  if (!d) return;
  let msg = `*NUEVO PEDIDO · NUTLU* 🧡\n\n`;
  msg += `*Cliente:* ${d.nombre}\n`;
  msg += `*WhatsApp:* ${d.tel}\n`;
  if (d.localidad) msg += `*Localidad:* ${d.localidad}\n`;
  msg += `*Fecha:* ${d.fecha}\n\n`;
  msg += `*Pedido:*\n${armarResumen(d)}\n`;
  msg += `*TOTAL: ${pesos(d.total)}*`;
  if (d.notas) msg += `\n\n*Aclaraciones:* ${d.notas}`;
  window.open(`https://wa.me/${WSP_NEGOCIO}?text=${encodeURIComponent(msg)}`, '_blank');
});

/* --- Enviar por email (Web3Forms) --- */
document.getElementById('btnMail').addEventListener('click', async () => {
  const d = datosValidos();
  if (!d) return;

  if (WEB3FORMS_KEY === 'PEGA-TU-ACCESS-KEY-ACA'){
    mostrarAviso('El envío por email todavía no está configurado. Por ahora usá el botón de WhatsApp 🙂', 'error');
    return;
  }

  const btn = document.getElementById('btnMail');
  btn.disabled = true; btn.style.opacity = '.6';

  let cuerpo = `NUEVO PEDIDO - NUTLU\n\n`;
  cuerpo += `Cliente: ${d.nombre}\nWhatsApp: ${d.tel}\n`;
  if (d.localidad) cuerpo += `Localidad: ${d.localidad}\n`;
  cuerpo += `Fecha: ${d.fecha}\n\nPedido:\n${armarResumen(d)}\nTOTAL: ${pesos(d.total)}`;
  if (d.notas) cuerpo += `\n\nAclaraciones: ${d.notas}`;

  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        subject: `Nuevo pedido NUTLU - ${d.nombre}`,
        from_name: 'Pedidos NUTLU',
        nombre: d.nombre,
        whatsapp: d.tel,
        message: cuerpo
      })
    });
    const json = await res.json();
    if (json.success){
      mostrarAviso('¡Pedido enviado! Te vamos a contactar para coordinar 🧡', 'ok');
    } else {
      mostrarAviso('No pudimos enviar el pedido. Probá de nuevo o escribinos por WhatsApp.', 'error');
    }
  } catch(e){
    mostrarAviso('Hubo un problema de conexión. Probá con el botón de WhatsApp.', 'error');
  } finally {
    btn.disabled = false; btn.style.opacity = '1';
  }
});
</script>
</body>
</html>
